name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Tools validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Python syntax
        run: python3 -W error -m compileall -q -f .

      - name: Validate map checker catalog integration
        run: |
          python3 -m unittest discover -s map-checker-qt/tests -v
          python3 map-checker-qt/dependencies.py validate
          python3 map-checker-qt/dependencies.py sync
          python3 map-checker-qt/dependencies.py verify

      - name: Check out bot content dependency
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: atrinik/content
          ref: 96073eeff1854fc29347fdafd32e622394f24c07
          path: build/dependencies/content
          persist-credentials: false

      - name: Install bot protocol dependency
        run: >-
          python3 -m pip install
          'atrinik-protocol @
          https://github.com/atrinik/protocol/releases/download/v1.0.9/atrinik_protocol-1.0.9-py3-none-any.whl#sha256=78954264fa49ac8736dbfc7a72669f619e0202e6ae15445a0b0839aa8f30eb8a'

      - name: Build and validate bot
        env:
          ATRINIK_RUNTIME_CONTENT: ${{ github.workspace }}/build/content-runtime
          PYTHONPATH: ${{ github.workspace }}/build/atrinik-bot/python:${{ github.workspace }}/build/dependencies/content/tools
        run: |
          cmake -S atrinik_bot -B build/atrinik-bot -G Ninja \
            -DBUILD_TESTING=ON
          cmake --build build/atrinik-bot --parallel
          ctest --test-dir build/atrinik-bot --output-on-failure
          python3 build/dependencies/content/tools/build_runtime.py \
            --source build/dependencies/content \
            --source-commit 96073eeff1854fc29347fdafd32e622394f24c07 \
            --output build/content-runtime
          cd build/atrinik-bot
          python3 -m unittest -v atrinik_bot.test_bot

      - name: Build randomizer
        run: |
          mkdir -p build
          cc -std=gnu99 -Wall -Wextra -Werror \
            -o build/randomizer randomizer/randomizer.c
